<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" width="800" height="1400" font-family="Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fefce8"/><stop offset="100%" stop-color="#f0fdf4"/></linearGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#166534"/></linearGradient>
<filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.10)"/></filter>
<marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="800" height="1400" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="70" fill="url(#hdr)"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="white">SilkSphere - Methodology and Approach</text>
<text x="400" y="54" text-anchor="middle" font-size="12" fill="#fef9c3">System Development Flowchart</text>

<rect x="280" y="90" width="240" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#sh)"/>
<text x="400" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Problem Identification</text>
<text x="400" y="132" text-anchor="middle" font-size="9" fill="#b45309">Silkworm disease causes crop loss</text>
<line x1="400" y1="146" x2="400" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<rect x="240" y="178" width="320" height="70" rx="10" fill="#fef9c3" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
<text x="400" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Requirements Analysis</text>
<text x="400" y="216" text-anchor="middle" font-size="9" fill="#b45309">Farmer needs: IoT monitoring, AI detection, marketplace</text>
<text x="400" y="230" text-anchor="middle" font-size="9" fill="#b45309">Buyer needs: verified batches, order management, wallet</text>
<line x1="400" y1="248" x2="400" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<rect x="240" y="280" width="320" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
<text x="400" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">System Design</text>
<text x="400" y="318" text-anchor="middle" font-size="9" fill="#166534">React frontend + FastAPI backend + AI model</text>
<text x="400" y="332" text-anchor="middle" font-size="9" fill="#166534">Role-based architecture: Farmer and Buyer</text>
<line x1="400" y1="350" x2="400" y2="382" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<text x="400" y="378" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="bold" letter-spacing="2">AI MODEL DEVELOPMENT</text>
<rect x="60" y="386" width="680" height="200" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>

<rect x="80" y="404" width="150" height="60" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="155" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b0764">Data Collection</text>
<text x="155" y="438" text-anchor="middle" font-size="8" fill="#5b21b6">Silkworm images</text>
<text x="155" y="450" text-anchor="middle" font-size="8" fill="#5b21b6">Healthy + Grasserie</text>
<text x="155" y="462" text-anchor="middle" font-size="8" fill="#5b21b6">Labeled dataset</text>
<text x="242" y="436" text-anchor="middle" font-size="16" fill="#7c3aed">-&gt;</text>

<rect x="255" y="404" width="150" height="60" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="330" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b0764">Preprocessing</text>
<text x="330" y="438" text-anchor="middle" font-size="8" fill="#5b21b6">Resize 224x224</text>
<text x="330" y="450" text-anchor="middle" font-size="8" fill="#5b21b6">Normalize -1 to 1</text>
<text x="330" y="462" text-anchor="middle" font-size="8" fill="#5b21b6">Augmentation</text>
<text x="417" y="436" text-anchor="middle" font-size="16" fill="#7c3aed">-&gt;</text>

<rect x="430" y="404" width="150" height="60" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="505" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b0764">Transfer Learning</text>
<text x="505" y="438" text-anchor="middle" font-size="8" fill="#5b21b6">MobileNetV2 base</text>
<text x="505" y="450" text-anchor="middle" font-size="8" fill="#5b21b6">Frozen weights</text>
<text x="505" y="462" text-anchor="middle" font-size="8" fill="#5b21b6">Custom head layers</text>
<text x="592" y="436" text-anchor="middle" font-size="16" fill="#7c3aed">-&gt;</text>

<rect x="605" y="404" width="120" height="60" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="665" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b0764">Training</text>
<text x="665" y="438" text-anchor="middle" font-size="8" fill="#5b21b6">Binary crossentropy</text>
<text x="665" y="450" text-anchor="middle" font-size="8" fill="#5b21b6">Adam optimizer</text>
<text x="665" y="462" text-anchor="middle" font-size="8" fill="#5b21b6">Sigmoid output</text>

<text x="400" y="498" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b0764">Model Architecture: Input(224x224x3) -&gt; MobileNetV2 -&gt; GAP -&gt; Dense(128,relu) -&gt; Dropout -&gt; Dense(1,sigmoid)</text>
<text x="400" y="516" text-anchor="middle" font-size="10" fill="#6d28d9">Output: 0.0 = Grasserie (Infected)   |   1.0 = Healthy</text>
<text x="400" y="534" text-anchor="middle" font-size="9" fill="#7e22ce">Saved as .keras format (Keras 3.14) - File size: 11MB</text>
<text x="400" y="550" text-anchor="middle" font-size="9" fill="#7e22ce">Deployed on FastAPI backend - Never exposed to frontend</text>
<text x="400" y="566" text-anchor="middle" font-size="9" fill="#7e22ce">Preprocessing: MobileNetV2 preprocess_input (scale to -1 to 1)</text>

<line x1="400" y1="586" x2="400" y2="618" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<text x="400" y="614" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="bold" letter-spacing="2">FRONTEND DEVELOPMENT</text>
<rect x="60" y="622" width="680" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
<text x="400" y="644" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">React.js + Vite Frontend</text>

<rect x="80" y="654" width="140" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="150" y="672" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Auth System</text>
<text x="150" y="686" text-anchor="middle" font-size="8" fill="#166534">Login + Register</text>
<text x="150" y="698" text-anchor="middle" font-size="8" fill="#166534">Role-based routing</text>

<rect x="235" y="654" width="140" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="305" y="672" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Farmer Module</text>
<text x="305" y="686" text-anchor="middle" font-size="8" fill="#166534">Dashboard + Batches</text>
<text x="305" y="698" text-anchor="middle" font-size="8" fill="#166534">AI Diagnostics</text>

<rect x="390" y="654" width="140" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="460" y="672" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Buyer Module</text>
<text x="460" y="686" text-anchor="middle" font-size="8" fill="#166534">Marketplace + Orders</text>
<text x="460" y="698" text-anchor="middle" font-size="8" fill="#166534">Wallet + Settings</text>

<rect x="545" y="654" width="180" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="635" y="672" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">State Management</text>
<text x="635" y="686" text-anchor="middle" font-size="8" fill="#166534">React Context API</text>
<text x="635" y="698" text-anchor="middle" font-size="8" fill="#166534">localStorage persistence</text>

<text x="400" y="736" text-anchor="middle" font-size="9" fill="#166534">IoT Sensor simulation (5s refresh) - Recharts for visualization - Lucide icons - Custom CSS</text>
<text x="400" y="752" text-anchor="middle" font-size="9" fill="#166534">Camera API (getUserMedia) for live capture - File upload for image analysis</text>

<line x1="400" y1="782" x2="400" y2="814" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<text x="400" y="810" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="bold" letter-spacing="2">BACKEND INTEGRATION</text>
<rect x="60" y="818" width="680" height="110" rx="12" fill="#fef9c3" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
<text x="400" y="840" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">FastAPI Backend Integration</text>
<text x="400" y="858" text-anchor="middle" font-size="9" fill="#b45309">Frontend sends image to POST /predict endpoint via FormData</text>
<text x="400" y="874" text-anchor="middle" font-size="9" fill="#b45309">Backend validates file type (jpg/png) and size (max 5MB)</text>
<text x="400" y="890" text-anchor="middle" font-size="9" fill="#b45309">Model runs inference and returns class_name + confidence + timestamp</text>
<text x="400" y="906" text-anchor="middle" font-size="9" fill="#b45309">Frontend displays result with confidence bar and scan history</text>

<line x1="400" y1="928" x2="400" y2="960" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<text x="400" y="956" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="bold" letter-spacing="2">TESTING AND VALIDATION</text>
<rect x="60" y="964" width="680" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
<text x="400" y="986" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Testing and Validation</text>
<text x="400" y="1004" text-anchor="middle" font-size="9" fill="#1d4ed8">AI Model: tested with healthy and Grasserie silkworm images</text>
<text x="400" y="1020" text-anchor="middle" font-size="9" fill="#1d4ed8">Frontend: tested login, register, batch management, marketplace flow</text>
<text x="400" y="1036" text-anchor="middle" font-size="9" fill="#1d4ed8">Backend: tested /predict endpoint with valid and invalid inputs</text>
<text x="400" y="1052" text-anchor="middle" font-size="9" fill="#1d4ed8">Camera: tested getUserMedia on Chrome and Edge browsers</text>

<line x1="400" y1="1064" x2="400" y2="1096" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<text x="400" y="1092" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="bold" letter-spacing="2">DEPLOYMENT</text>
<rect x="60" y="1100" width="680" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
<text x="400" y="1122" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Deployment Strategy</text>
<text x="400" y="1140" text-anchor="middle" font-size="9" fill="#166534">Frontend: Vercel (auto-deploy on GitHub push, CDN, SPA routing via vercel.json)</text>
<text x="400" y="1156" text-anchor="middle" font-size="9" fill="#166534">Backend: Railway or Render (Python 3.11, uvicorn, PORT env variable)</text>
<text x="400" y="1172" text-anchor="middle" font-size="9" fill="#166534">Connection: VITE_BACKEND_URL environment variable in Vercel dashboard</text>

<line x1="400" y1="1190" x2="400" y2="1222" stroke="#6b7280" stroke-width="2" marker-end="url(#a1)"/>

<rect x="240" y="1222" width="320" height="56" rx="28" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5" filter="url(#sh)"/>
<text x="400" y="1246" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Working System</text>
<text x="400" y="1264" text-anchor="middle" font-size="9" fill="#166534">AI-Powered Sericulture Management Platform</text>

<rect x="60" y="1300" width="680" height="80" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1.5" filter="url(#sh)"/>
<text x="400" y="1322" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Key Outcomes</text>
<text x="200" y="1344" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="bold">Real-time IoT Monitoring</text>
<text x="400" y="1344" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="bold">AI Disease Detection</text>
<text x="600" y="1344" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="bold">Digital Marketplace</text>
<text x="200" y="1362" text-anchor="middle" font-size="8" fill="#6b7280">Temperature, Humidity, CO2</text>
<text x="400" y="1362" text-anchor="middle" font-size="8" fill="#6b7280">MobileNetV2 - 11MB model</text>
<text x="600" y="1362" text-anchor="middle" font-size="8" fill="#6b7280">Graded batches + Wallet</text>
<text x="400" y="1382" text-anchor="middle" font-size="9" fill="#9ca3af">SilkSphere Platform - April 2026</text>
</svg>