<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="1200" fill="#0a0a0a" rx="16"/>

  <!-- Title -->
  <rect x="50" y="20" width="800" height="60" rx="10" fill="#1b5e20"/>
  <text x="450" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="white">SilkSphere — Technical Architecture Flow</text>

  <!-- ─── ROW 1: USER LAYER ─── -->
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">USER LAYER</text>

  <!-- Farmer Box -->
  <rect x="80" y="120" width="160" height="60" rx="10" fill="#1b5e20" stroke="#4caf50" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🌿 Farmer</text>
  <text x="160" y="165" text-anchor="middle" font-size="10" fill="#a5d6a7">Silkworm Grower</text>

  <!-- Buyer Box -->
  <rect x="660" y="120" width="160" height="60" rx="10" fill="#1a237e" stroke="#5c6bc0" stroke-width="2"/>
  <text x="740" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🏭 Buyer</text>
  <text x="740" y="165" text-anchor="middle" font-size="10" fill="#9fa8da">Industry Purchaser</text>

  <!-- Arrows down from users -->
  <line x1="160" y1="180" x2="160" y2="220" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="180" x2="740" y2="220" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ─── ROW 2: AUTH LAYER ─── -->
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">AUTHENTICATION</text>

  <rect x="80" y="225" width="160" height="55" rx="10" fill="#212121" stroke="#4caf50" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#4caf50">Login / Register</text>
  <text x="160" y="265" text-anchor="middle" font-size="9" fill="#888">Role-based Auth</text>
  <text x="160" y="277" text-anchor="middle" font-size="9" fill="#888">localStorage Session</text>

  <rect x="660" y="225" width="160" height="55" rx="10" fill="#212121" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="740" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c6bc0">Login / Register</text>
  <text x="740" y="265" text-anchor="middle" font-size="9" fill="#888">Role-based Auth</text>
  <text x="740" y="277" text-anchor="middle" font-size="9" fill="#888">localStorage Session</text>

  <!-- Arrows down -->
  <line x1="160" y1="280" x2="160" y2="320" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="280" x2="740" y2="320" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ─── ROW 3: REACT FRONTEND ─── -->
  <text x="450" y="315" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">REACT.JS FRONTEND (Vite)</text>

  <!-- Farmer Pages -->
  <rect x="30" y="325" width="260" height="180" rx="10" fill="#1a1a1a" stroke="#2e7d32" stroke-width="2"/>
  <text x="160" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#4caf50">Farmer Dashboard</text>

  <rect x="45" y="358" width="105" height="32" rx="6" fill="#1b5e20"/>
  <text x="97" y="370" text-anchor="middle" font-size="9" fill="white" font-weight="bold">📊 Dashboard</text>
  <text x="97" y="382" text-anchor="middle" font-size="8" fill="#a5d6a7">IoT Sensors + Charts</text>

  <rect x="165" y="358" width="105" height="32" rx="6" fill="#1b5e20"/>
  <text x="217" y="370" text-anchor="middle" font-size="9" fill="white" font-weight="bold">📦 My Batches</text>
  <text x="217" y="382" text-anchor="middle" font-size="8" fill="#a5d6a7">Grade + Manage</text>

  <rect x="45" y="400" width="105" height="32" rx="6" fill="#1b5e20"/>
  <text x="97" y="412" text-anchor="middle" font-size="9" fill="white" font-weight="bold">🔬 AI Diagnostics</text>
  <text x="97" y="424" text-anchor="middle" font-size="8" fill="#a5d6a7">Camera + Upload</text>

  <rect x="165" y="400" width="105" height="32" rx="6" fill="#1b5e20"/>
  <text x="217" y="412" text-anchor="middle" font-size="9" fill="white" font-weight="bold">🌀 Life Cycle</text>
  <text x="217" y="424" text-anchor="middle" font-size="8" fill="#a5d6a7">Stage Tracker</text>

  <rect x="45" y="442" width="105" height="32" rx="6" fill="#1b5e20"/>
  <text x="97" y="454" text-anchor="middle" font-size="9" fill="white" font-weight="bold">🌡 Environment</text>
  <text x="97" y="466" text-anchor="middle" font-size="8" fill="#a5d6a7">Sensor Monitor</text>

  <rect x="165" y="442" width="105" height="32" rx="6" fill="#1b5e20"/>
  <text x="217" y="454" text-anchor="middle" font-size="9" fill="white" font-weight="bold">📈 Analytics</text>
  <text x="217" y="466" text-anchor="middle" font-size="8" fill="#a5d6a7">Charts + Trends</text>

  <!-- Buyer Pages -->
  <rect x="610" y="325" width="260" height="180" rx="10" fill="#1a1a1a" stroke="#283593" stroke-width="2"/>
  <text x="740" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c6bc0">Buyer Dashboard</text>

  <rect x="625" y="358" width="105" height="32" rx="6" fill="#1a237e"/>
  <text x="677" y="370" text-anchor="middle" font-size="9" fill="white" font-weight="bold">🛒 Marketplace</text>
  <text x="677" y="382" text-anchor="middle" font-size="8" fill="#9fa8da">Browse Batches</text>

  <rect x="745" y="358" width="105" height="32" rx="6" fill="#1a237e"/>
  <text x="797" y="370" text-anchor="middle" font-size="9" fill="white" font-weight="bold">📋 My Orders</text>
  <text x="797" y="382" text-anchor="middle" font-size="8" fill="#9fa8da">Order History</text>

  <rect x="625" y="400" width="105" height="32" rx="6" fill="#1a237e"/>
  <text x="677" y="412" text-anchor="middle" font-size="9" fill="white" font-weight="bold">💰 Wallet</text>
  <text x="677" y="424" text-anchor="middle" font-size="8" fill="#9fa8da">Add / Withdraw</text>

  <rect x="745" y="400" width="105" height="32" rx="6" fill="#1a237e"/>
  <text x="797" y="412" text-anchor="middle" font-size="9" fill="white" font-weight="bold">⚙ Settings</text>
  <text x="797" y="424" text-anchor="middle" font-size="8" fill="#9fa8da">Profile + Prefs</text>

  <!-- Shared Marketplace -->
  <rect x="340" y="325" width="220" height="80" rx="10" fill="#1a1a1a" stroke="#f57f17" stroke-width="2"/>
  <text x="450" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffb300">🏪 Marketplace</text>
  <text x="450" y="366" text-anchor="middle" font-size="9" fill="#888">Farmer lists graded batches</text>
  <text x="450" y="380" text-anchor="middle" font-size="9" fill="#888">Buyer browses + places orders</text>
  <text x="450" y="394" text-anchor="middle" font-size="9" fill="#888">Cart → Order → Wallet payment</text>

  <!-- AppContext -->
  <rect x="340" y="420" width="220" height="80" rx="10" fill="#1a1a1a" stroke="#7b1fa2" stroke-width="2"/>
  <text x="450" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#ce93d8">⚛ AppContext</text>
  <text x="450" y="461" text-anchor="middle" font-size="9" fill="#888">Global State (React Context)</text>
  <text x="450" y="475" text-anchor="middle" font-size="9" fill="#888">user · batches · orders · wallet</text>
  <text x="450" y="489" text-anchor="middle" font-size="9" fill="#888">sensor · alerts · cart · toasts</text>

  <!-- Arrow from AI Diagnostics down to API -->
  <line x1="97" y1="505" x2="97" y2="560" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="97" y1="505" x2="350" y2="560" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- ─── ROW 4: API LAYER ─── -->
  <text x="450" y="555" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">BACKEND API LAYER (FastAPI / Python 3.11)</text>

  <rect x="100" y="565" width="700" height="70" rx="10" fill="#1a1a1a" stroke="#4caf50" stroke-width="2"/>

  <rect x="115" y="578" width="150" height="44" rx="7" fill="#1b5e20"/>
  <text x="190" y="596" text-anchor="middle" font-size="10" font-weight="bold" fill="white">POST /predict</text>
  <text x="190" y="610" text-anchor="middle" font-size="8" fill="#a5d6a7">Image → AI Inference</text>

  <rect x="280" y="578" width="150" height="44" rx="7" fill="#212121" stroke="#555" stroke-width="1"/>
  <text x="355" y="596" text-anchor="middle" font-size="10" font-weight="bold" fill="#aaa">GET /</text>
  <text x="355" y="610" text-anchor="middle" font-size="8" fill="#666">Health Check</text>

  <rect x="445" y="578" width="150" height="44" rx="7" fill="#212121" stroke="#555" stroke-width="1"/>
  <text x="520" y="596" text-anchor="middle" font-size="10" font-weight="bold" fill="#aaa">Rate Limiting</text>
  <text x="520" y="610" text-anchor="middle" font-size="8" fill="#666">30 req/min · SlowAPI</text>

  <rect x="610" y="578" width="175" height="44" rx="7" fill="#212121" stroke="#555" stroke-width="1"/>
  <text x="697" y="596" text-anchor="middle" font-size="10" font-weight="bold" fill="#aaa">CORS + Validation</text>
  <text x="697" y="610" text-anchor="middle" font-size="8" fill="#666">File type · Size · Auth</text>

  <!-- Arrow down to AI Model -->
  <line x1="450" y1="635" x2="450" y2="680" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- ─── ROW 5: AI MODEL ─── -->
  <text x="450" y="675" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">AI MODEL LAYER</text>

  <rect x="100" y="685" width="700" height="160" rx="12" fill="#0d1f0d" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- Model title -->
  <text x="450" y="710" text-anchor="middle" font-size="14" font-weight="bold" fill="#4caf50">silkworm_disease_model.keras</text>
  <text x="450" y="727" text-anchor="middle" font-size="10" fill="#666">MobileNetV2 Transfer Learning · Keras 3.14 · ~11MB</text>

  <!-- Pipeline boxes -->
  <rect x="115" y="738" width="110" height="50" rx="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1"/>
  <text x="170" y="758" text-anchor="middle" font-size="9" font-weight="bold" fill="white">📷 Input Image</text>
  <text x="170" y="772" text-anchor="middle" font-size="8" fill="#a5d6a7">JPG/PNG upload</text>
  <text x="170" y="782" text-anchor="middle" font-size="8" fill="#a5d6a7">Max 5MB</text>

  <text x="240" y="768" text-anchor="middle" font-size="16" fill="#4caf50">→</text>

  <rect x="250" y="738" width="110" height="50" rx="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1"/>
  <text x="305" y="758" text-anchor="middle" font-size="9" font-weight="bold" fill="white">🔧 Preprocess</text>
  <text x="305" y="772" text-anchor="middle" font-size="8" fill="#a5d6a7">Resize 224×224</text>
  <text x="305" y="782" text-anchor="middle" font-size="8" fill="#a5d6a7">Scale [-1, 1]</text>

  <text x="375" y="768" text-anchor="middle" font-size="16" fill="#4caf50">→</text>

  <rect x="385" y="738" width="130" height="50" rx="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1"/>
  <text x="450" y="755" text-anchor="middle" font-size="9" font-weight="bold" fill="white">🧠 MobileNetV2</text>
  <text x="450" y="769" text-anchor="middle" font-size="8" fill="#a5d6a7">154 Conv Layers</text>
  <text x="450" y="779" text-anchor="middle" font-size="8" fill="#a5d6a7">GlobalAvgPool → Dense(128)</text>

  <text x="530" y="768" text-anchor="middle" font-size="16" fill="#4caf50">→</text>

  <rect x="540" y="738" width="110" height="50" rx="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1"/>
  <text x="595" y="758" text-anchor="middle" font-size="9" font-weight="bold" fill="white">📊 Sigmoid</text>
  <text x="595" y="772" text-anchor="middle" font-size="8" fill="#a5d6a7">Output: 0.0 → 1.0</text>
  <text x="595" y="782" text-anchor="middle" font-size="8" fill="#a5d6a7">Binary Classification</text>

  <text x="665" y="768" text-anchor="middle" font-size="16" fill="#4caf50">→</text>

  <rect x="675" y="738" width="110" height="50" rx="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1"/>
  <text x="730" y="755" text-anchor="middle" font-size="9" font-weight="bold" fill="white">✅ Result</text>
  <text x="730" y="769" text-anchor="middle" font-size="8" fill="#4caf50">≥0.5 → Healthy</text>
  <text x="730" y="779" text-anchor="middle" font-size="8" fill="#ef5350">&lt;0.5 → Grasserie</text>

  <!-- Confidence bar -->
  <text x="450" y="820" text-anchor="middle" font-size="9" fill="#666">Confidence Score returned to frontend (0–100%)</text>
  <rect x="200" y="828" width="500" height="8" rx="4" fill="#1b5e20"/>
  <rect x="200" y="828" width="350" height="8" rx="4" fill="#4caf50"/>
  <text x="555" y="838" font-size="8" fill="#4caf50">70%</text>

  <!-- Arrow down to storage -->
  <line x1="450" y1="845" x2="450" y2="890" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <!-- ─── ROW 6: STORAGE ─── -->
  <text x="450" y="885" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">DATA STORAGE</text>

  <rect x="100" y="895" width="200" height="65" rx="10" fill="#1a1a1a" stroke="#f57f17" stroke-width="1.5"/>
  <text x="200" y="918" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffb300">💾 localStorage</text>
  <text x="200" y="934" text-anchor="middle" font-size="9" fill="#888">Users · Sessions · Batches</text>
  <text x="200" y="948" text-anchor="middle" font-size="9" fill="#888">Orders · Wallet · Alerts</text>

  <rect x="350" y="895" width="200" height="65" rx="10" fill="#1a1a1a" stroke="#1565c0" stroke-width="1.5"/>
  <text x="450" y="918" text-anchor="middle" font-size="11" font-weight="bold" fill="#42a5f5">🔥 Firebase</text>
  <text x="450" y="934" text-anchor="middle" font-size="9" fill="#888">Auth (JWT) — Ready</text>
  <text x="450" y="948" text-anchor="middle" font-size="9" fill="#888">Firestore — Future</text>

  <rect x="600" y="895" width="200" height="65" rx="10" fill="#1a1a1a" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="700" y="918" text-anchor="middle" font-size="11" font-weight="bold" fill="#ce93d8">📡 IoT Sensors</text>
  <text x="700" y="934" text-anchor="middle" font-size="9" fill="#888">ESP32 + BME280 + MQ135</text>
  <text x="700" y="948" text-anchor="middle" font-size="9" fill="#888">Simulated (5s refresh)</text>

  <!-- ─── ROW 7: DEPLOYMENT ─── -->
  <text x="450" y="990" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold" letter-spacing="3">DEPLOYMENT</text>

  <rect x="150" y="1000" width="240" height="60" rx="10" fill="#1a1a1a" stroke="#00897b" stroke-width="1.5"/>
  <text x="270" y="1025" text-anchor="middle" font-size="12" font-weight="bold" fill="#4db6ac">▲ Vercel</text>
  <text x="270" y="1043" text-anchor="middle" font-size="9" fill="#888">React Frontend · CDN · Auto-deploy</text>

  <rect x="510" y="1000" width="240" height="60" rx="10" fill="#1a1a1a" stroke="#e65100" stroke-width="1.5"/>
  <text x="630" y="1025" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8a65">🚂 Railway / Render</text>
  <text x="630" y="1043" text-anchor="middle" font-size="9" fill="#888">FastAPI Backend · AI Model · Python</text>

  <!-- Connect deployment -->
  <line x1="390" y1="1030" x2="510" y2="1030" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
  <text x="450" y="1025" text-anchor="middle" font-size="8" fill="#666">VITE_BACKEND_URL</text>

  <!-- ─── LEGEND ─── -->
  <rect x="100" y="1085" width="700" height="95" rx="10" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="450" y="1105" text-anchor="middle" font-size="11" font-weight="bold" fill="#aaa">TECH STACK</text>
  <text x="160" y="1125" text-anchor="middle" font-size="10" fill="#4caf50">⚛ React 19 + Vite 8</text>
  <text x="310" y="1125" text-anchor="middle" font-size="10" fill="#42a5f5">⚡ FastAPI + Uvicorn</text>
  <text x="460" y="1125" text-anchor="middle" font-size="10" fill="#ce93d8">🧠 TensorFlow + Keras</text>
  <text x="630" y="1125" text-anchor="middle" font-size="10" fill="#ffb300">📊 Recharts + Lucide</text>
  <text x="160" y="1148" text-anchor="middle" font-size="10" fill="#4caf50">🎨 Custom CSS</text>
  <text x="310" y="1148" text-anchor="middle" font-size="10" fill="#42a5f5">🐍 Python 3.11</text>
  <text x="460" y="1148" text-anchor="middle" font-size="10" fill="#ce93d8">📱 MobileNetV2</text>
  <text x="630" y="1148" text-anchor="middle" font-size="10" fill="#ffb300">🔥 Firebase Admin</text>
  <text x="450" y="1170" text-anchor="middle" font-size="9" fill="#555">SilkSphere Platform · AI-Powered Sericulture Management · April 2026</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4caf50"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5c6bc0"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
